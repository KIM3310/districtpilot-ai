name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-py:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install ruff + syntax deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.9.0

      - name: Ruff lint (Python scripts only)
        run: |
          ruff check \
            build_demo_video.py \
            generate_pptx.py \
            streamlit_app_v8.py

      - name: Python syntax check (compile-only)
        run: |
          python -m compileall -q \
            build_demo_video.py \
            generate_pptx.py \
            streamlit_app_v8.py

  lint-sql:
    name: SQL syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install sqlfluff
        run: |
          python -m pip install --upgrade pip
          pip install "sqlfluff==3.2.5"

      - name: sqlfluff parse (Snowflake dialect)
        run: |
          # sqlfluff accepts one path per invocation. Keep Snowflake parser
          # gaps informational while allowing invocation/config errors to fail.
          for file in ./*.sql; do
            echo "Parsing ${file}"
            sqlfluff parse --dialect snowflake --nofail "${file}"
          done
